set -g prefix C-space

set -g default-shell /bin/zsh

# 真彩色 + 256色终端
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -ga terminal-overrides ",*:Smulx=\E[4::%p1%dm"   # undercurl
set -ga terminal-overrides ",*:Setulc=\E[58::2::%p1%{6}%*%d::%p1%{256}%/%d::%p1%{256}%*%{255}%&%d"  # undercurl color

# 聚焦事件(vim autoread 等依赖)
set -g focus-events on

# reload 配置
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# 会话和窗口从1开始
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# 开启鼠标
set -g mouse on

# clipboard
set -g set-clipboard on

# history
set -g history-limit 99999

set -g mode-keys vi

# split current window horizontally
bind - split-window -v
# split current window vertically
bind | split-window -h
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ctrl+z
unbind-key C-z
bind-key -n C-z send-keys C-z

# plugin
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   bash ~/.tmux/plugins/tpm/bin/install_plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# 🌈 彩虹状态栏（依赖 tmux >= 3.2 的 format 运算，需放在 tpm run 之前也可以）
source-file ~/.config/tmux/rainbow-status.conf

run '~/.tmux/plugins/tpm/tpm'
