# 🌈 tmux 彩虹状态栏配置（追加到 ~/.tmux.conf 即可）
#
# 原理：tmux 3.2+ 的 format 支持 #{e|...} 运算，用 窗口编号 mod 7
# 选一个颜色，再配合 7 个嵌套三元 #{?...} 直接生成 bg=colourXXX。
# 所有颜色都写在 window-status-format 里，不改全局 status-style。

# ---- 彩虹色表（256 色，按色相排：红 橙 黄 绿 青 蓝 紫）----
# window_index mod 7 == 0..6 时分别使用：
# 0=colour196(红) 1=colour208(橙) 2=colour226(黄) 3=colour046(绿)
# 4=colour051(青) 5=colour021(蓝) 6=colour165(紫)

# 非当前窗口：mod 7 取彩虹底色，黑字
set -g window-status-format "#[fg=black,bg=#{?#{e|==:#{e|%:#{window_index},7},0},colour196,#{?#{e|==:#{e|%:#{window_index},7},1},colour208,#{?#{e|==:#{e|%:#{window_index},7},2},colour226,#{?#{e|==:#{e|%:#{window_index},7},3},colour046,#{?#{e|==:#{e|%:#{window_index},7},4},colour051,#{?#{e|==:#{e|%:#{window_index},7},5},colour021,colour165}}}}}}] #I:#W #[default]"

# 当前窗口：与非当前窗口反色 —— 彩虹字 + 深色底，一眼分辨
set -g window-status-current-format "#[fg=#{?#{e|==:#{e|%:#{window_index},7},0},colour196,#{?#{e|==:#{e|%:#{window_index},7},1},colour208,#{?#{e|==:#{e|%:#{window_index},7},2},colour226,#{?#{e|==:#{e|%:#{window_index},7},3},colour046,#{?#{e|==:#{e|%:#{window_index},7},4},colour051,#{?#{e|==:#{e|%:#{window_index},7},5},colour021,colour165}}}}}},bg=colour234,bold] #I:#W #[default]"

# ---- 左右两侧也上色（可选，按你喜好调）----
# 左边：会话名（彩虹底色同款机制：取当前窗口 mod 7 的颜色）
set -g status-left "#[bg=colour244,fg=white,bold][#{session_name}]#[default]"

# 右边时间日期：紫底黑字
set -g status-right "#[bg=colour165,fg=black] %H:%M %d-%b #[default]"

# 底色（非彩虹窗口、剩余空隙）：中灰，衬托彩虹
set -g status-style "bg=colour240,fg=white"

# 窗口切换立即变色（彩虹是按 window_index 算的，默认15s才刷新）
set -g status-interval 1

# 左侧内容长度上限
set -g status-left-length 20

# 窗口按钮之间不留缝（默认是一个空格分隔符）
set -g window-status-separator ""
